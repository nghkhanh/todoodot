<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todoodot Tool Tester</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">MCP local tools</p>
          <h1>Todoodot</h1>
        </div>
        <div class="tool-pills" aria-label="Available local tools">
          <span>list_task</span>
          <span>add_task</span>
          <span>complete_task</span>
        </div>
      </header>

      <section class="workspace" aria-label="Task tool tester">
        <form class="task-form" id="task-form">
          <div class="panel-heading">
            <h2>Add Task</h2>
            <button class="icon-button" type="button" id="seed-button" aria-label="Add sample tasks" title="Add sample tasks">
              +
            </button>
          </div>

          <label for="task-title">Title</label>
          <input id="task-title" name="title" type="text" autocomplete="off" placeholder="Review MCP setup" required />

          <label for="task-description">Description</label>
          <textarea id="task-description" name="description" rows="7" placeholder="Source, context, acceptance criteria"></textarea>

          <button class="primary-button" type="submit">Add Task</button>

          <div class="tool-output" aria-live="polite">
            <span>Last tool call</span>
            <pre id="tool-output">list_task({ include_completed: false })</pre>
          </div>
        </form>

        <section class="task-panel">
          <div class="panel-heading">
            <div>
              <h2>Tasks</h2>
              <p id="task-count">0 active</p>
            </div>
            <div class="toolbar" aria-label="Task filters">
              <button class="toolbar-button is-active" type="button" data-filter="active">Active</button>
              <button class="toolbar-button" type="button" data-filter="all">All</button>
              <button class="toolbar-button" type="button" data-filter="completed">Done</button>
            </div>
          </div>

          <div class="task-list" id="task-list"></div>

          <div class="empty-state" id="empty-state">
            <h3>No tasks</h3>
            <p>Create one from the form.</p>
          </div>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
